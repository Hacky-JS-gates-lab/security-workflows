# The org's security gate, called by .github/workflows/security.yml in every repo.
# Callers pin this file by full commit SHA, so a change here reaches a repo only when
# its caller is bumped (by a PR the security team owns).
name: security-gate

on:
  workflow_call:
    inputs:
      mode:
        description: "audit: record only. warn: annotate, never fail. block: fail on new findings."
        type: string
        required: false
        default: block

permissions: {}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repo under test (full history, for the baseline)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the gate's own rules and scripts, at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: gate
          persist-credentials: false

      - name: Run the gate
        working-directory: repo
        env:
          MODE: ${{ inputs.mode }}
          GATE_DIR: ${{ github.workspace }}/gate
          GATE_REF: ${{ job.workflow_repository }}@${{ job.workflow_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: ../gate/scripts/gate.sh

      - name: Keep the findings for noise measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-gate-findings
          path: ${{ runner.temp }}/gate/findings.json
          if-no-files-found: ignore
          retention-days: 30
