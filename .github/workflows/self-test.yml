# Runs this repo's own version of the gate on every PR to it, so a broken gate fails
# here before any caller is bumped. The job id `security` gives the same check name
# as in the fleet repos: "security / gate".
name: security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-gate.yml
    with:
      mode: block

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test of the new-package check (no network)
        run: node --test scripts/*.test.js
